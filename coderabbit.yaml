language: "ko-KR"

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/generated/**"
    - "!**/*.generated.java"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/resources/static/**"

  path_instructions:
    - path: "**/*.java"
      instructions: |
        Java 21 + Spring Boot 3.x + Spring Cloud Gateway(WebFlux) 기반 코드를 검토해주세요.

        [Gateway]
        - Gateway가 비즈니스 로직을 직접 처리하지 않는지 확인해주세요
        - 라우팅, 인증/인가, 헤더 전달, CORS 등 Gateway 책임에 집중되어 있는지 확인해주세요
        - 특정 서비스의 내부 구현에 강하게 결합되어 있으면 지적해주세요
        - 서비스 URI가 하드코딩되어 있는지 확인해주세요
        - Eureka 기반 서비스 디스커버리와 LoadBalancer 사용이 적절한지 확인해주세요

        [WebFlux]
        - Servlet 기반 API(HttpServletRequest, HttpServletResponse, OncePerRequestFilter 등)를 사용하고 있으면 지적해주세요
        - GatewayFilter, GlobalFilter, ServerWebExchange 등 WebFlux 기반 API 사용 여부를 확인해주세요
        - blocking API 호출(JPA, JDBC, Thread.sleep 등)이 reactive 처리 흐름 안에 포함되어 있으면 지적해주세요
        - Mono/Flux 체인 내부에서 불필요한 block() 호출이 있으면 반드시 지적해주세요

        [Filter]
        - GlobalFilter와 route-specific filter의 책임이 명확한지 확인해주세요
        - 필터 순서(order)에 의존하는 로직이 있다면 명확하게 관리되는지 확인해주세요
        - 인증 실패나 downstream 오류 처리 방식이 일관적인지 확인해주세요

        [Security]
        - 인증 정보가 Gateway에서 안전하게 검증되는지 확인해주세요
        - JWT 또는 사용자 정보가 헤더로 전달될 경우 위변조 가능성을 고려했는지 확인해주세요
        - 외부 요청이 내부 전용 헤더를 임의로 주입할 수 있는 구조인지 확인해주세요
        - 공개 API와 인증 필요 API의 구분이 명확한지 확인해주세요

        [Configuration]
        - application.yml의 route 설정이 중복되거나 과도하게 복잡하지 않은지 확인해주세요
        - Eureka URL, 서비스 주소, 비밀값 등이 코드에 하드코딩되어 있으면 지적해주세요
        - local/dev/prod 환경 분리가 필요한 설정이 있는지 확인해주세요
        - timeout, retry 같은 네트워크 설정이 과도하거나 위험하게 설정되어 있지 않은지 확인해주세요

        [Spring Boot 3.x]
        - javax 대신 jakarta 네임스페이스를 올바르게 사용하는지 확인해주세요
        - deprecated API나 구식 Spring Cloud Gateway 설정을 사용하는지 확인해주세요

        [공통]
        - 불필요한 복잡성, 중복 코드, 순환 참조 가능성을 확인해주세요
        - 예외 로그에 토큰이나 개인정보 등 민감정보가 노출되지 않는지 확인해주세요

    - path: "**/*Filter.java"
      instructions: |
        Spring Cloud Gateway WebFlux 필터 코드를 집중적으로 검토해주세요.

        - blocking 호출이 포함되어 있지 않은지 확인해주세요
        - ServerWebExchange를 불필요하게 수정하지 않는지 확인해주세요
        - request/response mutation이 안전하게 수행되는지 확인해주세요
        - 필터 실행 순서가 명확하고 예상 가능한지 확인해주세요
        - 인증 실패 시 적절한 HTTP 상태 코드와 응답을 반환하는지 확인해주세요
        - Authorization, 사용자 ID, 역할 등 민감 헤더 처리 시 보안 문제가 없는지 확인해주세요

    - path: "**/application*.yml"
      instructions: |
        Spring Cloud Gateway 설정 파일을 검토해주세요.

        - Gateway 포트 및 application name이 명확한지 확인해주세요
        - Eureka defaultZone 설정이 환경에 적절한지 확인해주세요
        - route의 id, uri, predicate, filter 구성이 명확한지 확인해주세요
        - lb:// 기반 서비스 디스커버리 사용이 올바른지 확인해주세요
        - localhost나 특정 호스트가 운영 환경까지 하드코딩될 가능성이 있는지 확인해주세요
        - 민감정보가 직접 작성되어 있으면 반드시 지적해주세요

    - path: "**/build.gradle"
      instructions: |
        Gateway 프로젝트 의존성을 검토해주세요.

        - Spring Boot / Spring Cloud 버전 호환성을 확인해주세요
        - WebFlux Gateway와 Web MVC 의존성이 동시에 포함되어 있지 않은지 확인해주세요
        - 불필요한 Spring Web MVC 의존성이 포함되어 있으면 지적해주세요
        - Eureka Client, Actuator 등 필요한 의존성이 적절한지 확인해주세요
        - 직접 버전을 고정해 BOM 관리와 충돌할 가능성이 있는지 확인해주세요

chat:
  auto_reply: true